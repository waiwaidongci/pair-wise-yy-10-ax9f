<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>漆线雕工坊 · 返工令与补线工位台</title>
  <style>
    :root {
      --bg: #eef3f0;
      --panel: #ffffff;
      --ink: #1e2624;
      --muted: #62706b;
      --line: #ccd8d2;
      --teal: #1f6b68;
      --red: #a43f42;
      --amber: #aa7a24;
      --violet: #665c93;
      --blue: #335b8a;
      --green: #3f7a4f;
      --gray: #707b77;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    header { padding: 22px 28px 16px; border-bottom: 1px solid var(--line); background: #fbfdfb; display: flex; justify-content: space-between; gap: 18px; align-items: end; }
    h1 { margin: 0; font-size: 26px; }
    h2.section-title { display:flex; align-items:center; gap:10px; }
    .sub, .meta { color: var(--muted); font-size: 13px; line-height: 1.55; }
    main { padding: 20px 28px 34px; display: grid; gap: 18px; }
    button, input, select, textarea { font: inherit; border-radius: 6px; }
    input, select, textarea { width: 100%; border: 1px solid var(--line); padding: 9px 10px; background: #fff; color: var(--ink); }
    textarea { min-height: 60px; resize: vertical; }
    button { border: 0; background: var(--teal); color: #fff; padding: 9px 11px; cursor: pointer; min-height: 38px; }
    button:hover { filter: brightness(1.07); }
    button.secondary { background: #5d6764; }
    button.warn { background: var(--amber); }
    button.danger { background: var(--red); }
    button.violet { background: var(--violet); }
    button.small { min-height: 30px; padding: 5px 9px; font-size: 12px; }
    label { display: grid; gap: 5px; font-size: 12px; color: var(--muted); }
    .top { display: grid; grid-template-columns: 360px 1fr; gap: 18px; align-items: start; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
    .panel h2 { margin: 0 0 12px; font-size: 17px; }
    form { display: grid; gap: 10px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .toolbar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 12px; }
    .lists { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
    .mini { border: 1px solid var(--line); border-radius: 8px; padding: 10px; background: #fbfdfb; min-height: 118px; }
    .mini h3 { margin: 0 0 8px; font-size: 14px; }
    .item { border: 1px solid #d7e0dc; border-left: 4px solid var(--teal); background: #fff; border-radius: 7px; padding: 9px; margin-bottom: 8px; cursor: pointer; }
    .item.overdue { border-left-color: var(--red); }
    .board { display: grid; grid-template-columns: repeat(4, minmax(185px, 1fr)); gap: 12px; overflow-x: auto; }
    .rework-board { display: grid; grid-template-columns: repeat(6, minmax(210px, 1fr)); gap: 12px; overflow-x: auto; }
    .col { background: #f9fbf9; border: 1px solid var(--line); border-radius: 8px; padding: 10px; min-height: 260px; }
    .col.col-amber { border-top: 3px solid var(--amber); }
    .col.col-teal { border-top: 3px solid var(--teal); }
    .col.col-blue { border-top: 3px solid var(--blue); }
    .col.col-violet { border-top: 3px solid var(--violet); }
    .col.col-green { border-top: 3px solid var(--green); }
    .col.col-gray { border-top: 3px solid var(--gray); opacity: .92; }
    .col h3 { display: flex; justify-content: space-between; margin: 0 0 10px; font-size: 15px; }
    .actions { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 8px; }
    .actions button { flex: 1; min-width: 82px; font-size: 12px; padding: 7px 8px; min-height: 30px; }
    dialog { border: 1px solid var(--line); border-radius: 8px; width: min(620px, calc(100vw - 24px)); padding: 0; }
    dialog::backdrop { background: rgba(0, 0, 0, 0.3); }
    .dialog-body { padding: 16px; display: grid; gap: 10px; }
    .empty { color: var(--muted); font-size: 13px; padding: 8px 0; }
    .tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 10px; margin-left: 4px; vertical-align: middle; }
    .tag-rw { background: #fdeaea; color: var(--red); }
    .tag-arch { background: #ececec; color: var(--gray); }
    .tag-new { background: #fff4da; color: var(--amber); }
    .tag-warn { background: #fff4da; color: var(--amber); }
    .rw-card { cursor: default; }
    .rw-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; }
    .mats { display:flex; flex-wrap:wrap; gap:5px; margin:7px 0 4px; }
    .mat { font-size: 11px; border-radius: 10px; padding: 2px 8px; }
    .mat-ok { background: #e6f1e8; color: var(--green); }
    .mat-no { background: #fdeaea; color: var(--red); }
    .reason { font-size: 12px; color: #45534e; background: #f4f7f5; border-radius: 5px; padding: 5px 7px; margin-top: 4px; }
    .mat-row { display: grid; grid-template-columns: 1.4fr .8fr auto auto; gap: 8px; align-items: center; }
    .mat-prep { display:flex; align-items:center; gap:4px; font-size:12px; color:var(--muted); }
    .mat-prep input { width:auto; }
    .mat-del { min-height: 34px; padding: 4px 10px; }
    .capacity { display:flex; gap:8px; flex-wrap:wrap; margin-bottom: 12px; }
    .cap-day { border:1px solid var(--line); background:#fbfdfb; border-radius:7px; padding:7px 9px; display:flex; gap:6px; align-items:center; }
    .cap-date { font-size:12px; color:var(--muted); font-weight:600; margin-right:2px; }
    .cap { font-size:11px; border-radius:10px; padding:2px 8px; background:#e6f1e8; color:var(--green); }
    .cap-near { background:#fff4da; color:var(--amber); }
    .cap-full { background:#fdeaea; color:var(--red); }
    .rule-note { font-size:12px; color:var(--muted); margin: 0 0 10px; }
    .header-actions { display:flex; gap:8px; flex-wrap:wrap; }
    @media (max-width: 980px) {
      header { display: block; padding: 18px; }
      main { padding: 16px; }
      .top, .lists, .toolbar { grid-template-columns: 1fr; }
      .grid2 { grid-template-columns: 1fr; }
      .rework-board, .board { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>漆线雕工坊 · 返工令与补线工位台</h1>
      <div class="sub">作品流转 · 缺陷返工令 · 补线排期 · 他人复核放行（本地持久化，刷新即与履历对齐）</div>
    </div>
    <div class="header-actions">
      <button id="refreshBtn" class="secondary">刷新重算排期</button>
      <button id="resetBtn" class="danger">恢复演示数据</button>
      <button id="exportBtn" class="secondary">导出 JSON</button>
    </div>
  </header>

  <main>
    <section class="top">
      <form id="workForm" class="panel">
        <h2>新增作品</h2>
        <div class="grid2">
          <label>胎体材质<input name="base" required placeholder="脱胎漆器"></label>
          <label>纹样主题<input name="theme" required placeholder="缠枝莲"></label>
        </div>
        <div class="grid2">
          <label>线条粗细<select name="line"><option>细线</option><option>中线</option><option>粗线</option><option>混合线</option></select></label>
          <label>贴线进度<input name="progress" type="number" min="0" max="100" value="25"></label>
        </div>
        <div class="grid2">
          <label>阴干日期<input name="dryDate" type="date" required></label>
          <label>交付日期<input name="delivery" type="date" required></label>
        </div>
        <div class="grid2">
          <label>金粉处理状态<select name="gold"><option>未处理</option><option>试扫粉</option><option>已上金粉</option></select></label>
          <label>当前状态<select name="status"><option>贴线中</option><option>待阴干</option><option>上金粉</option><option>待交付</option></select></label>
        </div>
        <label>缺陷位置<input name="defect" placeholder="右下花瓣断线（有缺陷才能开返工令）"></label>
        <label>备注<textarea name="note" placeholder="客户偏好、修补记录"></textarea></label>
        <button type="submit">加入工坊</button>
      </form>

      <section class="panel">
        <h2>今日与风险</h2>
        <div class="lists">
          <div class="mini"><h3>今日待阴干</h3><div id="todayDry"></div></div>
          <div class="mini"><h3>缺陷作品</h3><div id="defectList"></div></div>
          <div class="mini"><h3>最近交付</h3><div id="deliveryList"></div></div>
        </div>
        <div class="toolbar">
          <label>主题筛选<input id="themeFilter" placeholder="输入纹样"></label>
          <label>状态筛选<select id="statusFilter"></select></label>
          <label>排序<select id="sortMode"><option value="delivery">按交付日期</option><option value="dry">按阴干日期</option></select></label>
          <button id="clearFilters" class="secondary">清空</button>
        </div>
        <div id="board" class="board"></div>
      </section>
    </section>

    <section class="panel">
      <h2 class="section-title">补线工位台
        <button id="openCreateOrder" class="warn small">为缺陷作品开具返工令</button>
      </h2>
      <p class="rule-note">
        规则：一件缺陷作品只能有一张未完结返工令；补线材料未备齐整令不入排期；
        同一责任工序每日最多 3 件，超出按交付日期近者先，被挤下件顺延但保留原排期原因；
        返工完成须由另一人复核后方可转待交付；更正派工字段则旧令留档、旧排期与放行结论失效。
      </p>
      <div id="capacityBar" class="capacity"></div>
      <div id="reworkBoard" class="rework-board"></div>
    </section>
  </main>

  <!-- 作品详情 -->
  <dialog id="detailDialog">
    <div class="dialog-body">
      <h2 id="detailTitle">作品详情</h2>
      <div id="detailContent" class="meta"></div>
      <label>记录缺陷<input id="defectInput" placeholder="断线/翘线位置"></label>
      <input type="hidden" id="workIdForOrder">
      <div class="actions">
        <button id="saveDefect" class="warn">保存缺陷</button>
        <button id="closeDialog" class="secondary">关闭</button>
      </div>
    </div>
  </dialog>

  <!-- 开具 / 更正返工令 -->
  <dialog id="orderDialog">
    <form method="dialog" class="dialog-body" onsubmit="return false">
      <h2 id="orderDialogTitle">开具返工令</h2>
      <div id="orderWorkRef" class="meta"></div>
      <div class="grid2">
        <label>责任工序<select id="orderProcess"></select></label>
        <label>操作者<input id="orderOperator" placeholder="如 阿珍"></label>
      </div>
      <label>承诺完成日<input id="orderPromised" type="date"></label>
      <div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
          <span style="font-size:12px;color:var(--muted);">补线材料（逐项登记并标记备齐）</span>
          <button type="button" id="addMaterial" class="secondary small">加一项材料</button>
        </div>
        <div id="materialEditor" style="display:grid;gap:8px;"></div>
      </div>
      <div class="actions">
        <button type="button" id="orderSubmit">提交返工令</button>
        <button type="button" id="orderCancel" class="secondary">取消</button>
      </div>
    </form>
  </dialog>

  <!-- 他人复核 -->
  <dialog id="reviewDialog">
    <div class="dialog-body">
      <h2>返工复核</h2>
      <div id="reviewRef" class="meta"></div>
      <label>复核人（须与操作者不同）<input id="reviewerName" placeholder="如 阿珍"></label>
      <label>复核意见（驳回时必填原因）<textarea id="reviewReason" placeholder="合格则留空；不通过写明问题"></textarea></label>
      <div class="actions">
        <button id="reviewPass" class="secondary">复核通过放行</button>
        <button id="reviewReject" class="danger">驳回返工</button>
        <button id="reviewCancel" class="secondary">取消</button>
      </div>
    </div>
  </dialog>

  <script src="js/models.js"></script>
  <script src="js/scheduler.js"></script>
  <script src="js/kanban.js"></script>
</body>
</html>
